# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - i18n:
        docs_structure: folder
        languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          theme:
            palette:
              primary: red
          nav:
            - Inicio: index_es.md
            - Configuracion:
              - Uso: ES/How_to_use.md
              - Lenguaje V: ES/Aixt_V_language.md
              - Archivos: ES/Setup_files.md
              - Tarjetas y dispositivos: ES/Devices_and_Boards.md
              - API: ES/API.md
              - Carpetas: 
                - General: ES/General_folder_tree.md
                - Librerias: ES/Libraries_folder_tree.md
                - API: ES/API_folder_tree.md
              - Prueba: ES/Testing.md
            - Documentos:
              - Ai Thinker: ES/Ai-Thinker/Ai-WB2-32S-Kit/quickref.md
              - Arduino: 
                - Arduino Mega: ES/Arduino/Arduino-Mega/quickref.md
                - Arduino Nano: ES/Arduino/Arduino-Nano/quickref.md
                - Arduino uno: ES/Arduino/Arduino-Uno/quickref.md
              - Atmel:
                - MH ATtiny88: ES/Atmel/MH-ATtiny88/quickref.md
              - Cypress:
                - CY8CKIT04942XX: ES/Cypress/PSoC4/CY8CKIT04942XX.md
                - CY8CKIT14540XX: ES/Cypress/PSoC4/CY8CKIT14540XX.md
              - Emulator: ES/Emulator/quickref.md
              - Lib:
                - OLED: ES/lib/oled/quickref.md
              - Luatos:
                - AIR32F103: ES/Luatos/AIR32F103/quickref.md
              - M0sense: ES/M0sense/M0sense.md
              - Microchip:
                - PIC 24:
                  - Explorer 16: ES/Microchip/Explorer-16/quickref.md
                - PIC 16:
                  - PIC16F8x: ES/Microchip/PIC16/PIC16F8x/quickref.md
                  - PIC16F676: ES/Microchip/PIC16/PIC16F676/quickref.md     
                  - PIC16F873A: ES/Microchip/PIC16/PIC16F873A/quickref.md
                  - PIC16F886: ES/Microchip/PIC16/PIC16F886/quiickref.md
                - Pic 18:
