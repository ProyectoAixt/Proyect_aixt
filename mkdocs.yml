# Configuration
theme:
  name: material
  custom_dir: material/overrides
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs # botones Home/Docs
    - navigation.top
    - navigation.tracking
    - search.highlight 
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/favicon.png
  logo: assets/images/nutria_logo.png


